name: Weekly Maintainer Triage

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Triage Script
        env:
          # This automatically provides a token so the script doesn't hit rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python triage.py --repo ${{ github.repository }} --days 30 > triage_report.md
          cat triage_report.md

      - name: Add Report to Action Summary
        run: |
          echo "## Weekly Triage Report" >> $GITHUB_STEP_SUMMARY
          cat triage_report.md >> $GITHUB_STEP_SUMMARY
