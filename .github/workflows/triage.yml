name: Scheduled Maintainer Triage

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read
  checks: read

concurrency:
  group: maint-triage-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate triage report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python triage.py --repo "$TARGET_REPOSITORY" --days 30 --format markdown > triage_report.md
          cat triage_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload triage report
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-triage-report
          path: triage_report.md
          if-no-files-found: error
          retention-days: 14
