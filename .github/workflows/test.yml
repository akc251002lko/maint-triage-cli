name: Maint Triage CLI CI

on:
  push:
    branches: [main, master, "upgrade/maintenance-intelligence-2026-11"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maint-triage-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and tests
        run: python -m py_compile triage.py tests/test_triage.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI help smoke test
        run: python triage.py --help
